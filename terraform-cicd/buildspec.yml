version: 0.2

# Build ステージ用：検証と plan まで（AWS は変更しない）
env:
  variables:
    TF_VERSION: "1.10.5"

phases:
  install:
    commands:
      - curl -sSLo terraform.zip https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip
      - unzip -q terraform.zip -d /usr/local/bin/
      - terraform version
  build:
    commands:
      - terraform -chdir=terraform-cicd init -input=false
      - terraform -chdir=terraform-cicd fmt -check
      - terraform -chdir=terraform-cicd validate
      - terraform -chdir=terraform-cicd plan -input=false
